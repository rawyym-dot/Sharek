<title>دفتر الشراكة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--p:#6D28D9;--p2:#8B5CF6;--pd:#4C1D95;--bg:#F4F2FB;--tx:#1F1B2E;--mu:#6B6880;--ln:#ECE9F5;--gr:#059669;--grb:#ECFDF5;--rd:#DC2626;--rdb:#FEF2F2;--a:#0EA5E9;--b:#F59E0B;--r:18px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:'Cairo',system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif}
body{min-height:100vh;overscroll-behavior-y:contain}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit;font-size:inherit;padding:0}
input,textarea,select{font-family:inherit;font-size:16px;color:var(--tx)}
svg{flex:none}
.top{background:linear-gradient(135deg,#4C1D95,#6D28D9 50%,#8B5CF6);color:#fff;padding:calc(env(safe-area-inset-top) + 14px) 16px 22px;border-radius:0 0 28px 28px;box-shadow:0 12px 30px -14px rgba(76,29,149,.7);position:relative;overflow:hidden}
.top:before{content:"";position:absolute;width:260px;height:260px;border-radius:50%;background:rgba(255,255,255,.07);top:-120px;left:-80px}
.top:after{content:"";position:absolute;width:180px;height:180px;border-radius:50%;background:rgba(255,255,255,.06);bottom:-90px;right:-40px}
.bar,.hero{max-width:760px;margin:0 auto;position:relative;z-index:1}
.bar{display:flex;align-items:center;gap:10px}
.ibtn{width:42px;height:42px;border-radius:14px;background:rgba(255,255,255,.16);display:grid;place-items:center}
.ibtn svg{width:22px;height:22px}
.ttl{flex:1;min-width:0}
.ttl b{display:block;font-size:19px;font-weight:800;line-height:1.3}
.ttl small{font-size:12px;opacity:.9;display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:#34D399;display:inline-block;box-shadow:0 0 0 3px rgba(52,211,153,.25)}
.dot.off{background:#FBBF24;box-shadow:0 0 0 3px rgba(251,191,36,.25)}.dot.loc{background:#CBD5E1;box-shadow:none}
.chip-me{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.16);padding:4px 12px 4px 5px;border-radius:999px;font-weight:700;font-size:14px;max-width:46%}
.chip-me span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.av{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-weight:800;color:#fff;font-size:14px;flex:none}
.av.lg{width:52px;height:52px;font-size:20px;border-radius:18px}
.hero{margin-top:18px}
.hero .lbl{font-size:13px;opacity:.85}
.hero .big{font-size:34px;font-weight:800;line-height:1.25;direction:rtl}
.hero .hint{font-size:13px;opacity:.9;margin-top:2px}
.hero .sub{display:flex;gap:10px;margin-top:14px}
.pill{flex:1;min-width:0;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.14);border-radius:16px;padding:10px 12px}
.pill span{display:flex;align-items:center;gap:6px;font-size:12px;opacity:.9;white-space:nowrap;overflow:hidden}
.pill span i{width:8px;height:8px;border-radius:50%;background:var(--c);flex:none}
.pill b{font-size:16px;display:block;margin-top:2px}
.main{max-width:760px;margin:0 auto;padding:16px 16px 120px}
.seg{display:flex;background:#fff;border-radius:15px;padding:4px;gap:4px;border:1px solid var(--ln)}
.seg button{flex:1;padding:9px;border-radius:11px;font-weight:700;color:var(--mu);font-size:14px;transition:.2s}
.seg button.on{background:var(--p);color:#fff;box-shadow:0 4px 12px -4px rgba(109,40,217,.6)}
.search{display:flex;align-items:center;gap:8px;background:#fff;border-radius:15px;padding:0 14px;margin:12px 0;border:1px solid var(--ln);color:var(--mu)}
.search svg{width:20px;height:20px}
.search input{flex:1;border:0;outline:0;padding:12px 0;background:none;min-width:0}
.chips{display:flex;gap:8px;margin:12px 0;overflow-x:auto;scrollbar-width:none}
.chips button{padding:7px 15px;border-radius:999px;background:#fff;border:1px solid var(--ln);font-weight:700;font-size:13px;white-space:nowrap;color:var(--mu)}
.chips button.on{background:var(--pd);color:#fff;border-color:var(--pd)}
.card{background:#fff;border-radius:var(--r);padding:14px;box-shadow:0 1px 3px rgba(30,20,60,.05);border:1px solid var(--ln);display:block;width:100%;text-align:right;transition:transform .12s}
button.card:active{transform:scale(.985)}
.list{display:grid;gap:10px}
@media(min-width:720px){.list.cust{grid-template-columns:1fr 1fr}}
.row{display:flex;align-items:center;gap:12px}
.grow{flex:1;min-width:0}
.nm{font-weight:700;font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mu{color:var(--mu);font-size:13px}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.prog{height:7px;background:var(--ln);border-radius:9px;overflow:hidden;margin:12px 0 8px}
.prog i{display:block;height:100%;background:linear-gradient(270deg,#10B981,#34D399);border-radius:9px;transition:width .4s}
.nums{display:flex;justify-content:space-between;gap:8px;font-size:13px;flex-wrap:wrap}
.nums b{font-size:14px}
.g{color:var(--gr)}.r{color:var(--rd)}
.badge{font-size:11px;font-weight:700;padding:3px 10px;border-radius:999px;white-space:nowrap}
.bg{background:var(--grb);color:var(--gr)}.br{background:#FFF7ED;color:#C2410C}.bv{background:#F3F0FF;color:var(--p)}
.tx-ic{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;flex:none}
.tx-ic svg{width:20px;height:20px}
.gi{background:var(--grb);color:var(--gr)}.ri{background:var(--rdb);color:var(--rd)}
.amt{font-weight:800;font-size:15.5px;white-space:nowrap;direction:ltr}
.tx-f{display:flex;align-items:center;gap:8px;margin-top:8px;padding-top:8px;border-top:1px dashed var(--ln)}
.ub{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:2px 10px 2px 3px;border-radius:999px;background:color-mix(in srgb,var(--c) 13%,#fff);color:color-mix(in srgb,var(--c) 75%,#000);white-space:nowrap;flex:none}
.ub i{width:18px;height:18px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;font-style:normal;font-size:10px}
.day{display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:800;color:var(--mu);margin:10px 4px 0}
.day b{font-weight:700;font-size:12px}
.empty{text-align:center;padding:46px 20px;color:var(--mu)}
.empty .eic{width:76px;height:76px;border-radius:26px;background:#EDE9FE;color:var(--p2);display:grid;place-items:center;margin:0 auto 12px}
.empty .eic svg{width:36px;height:36px}
.empty b{display:block;color:var(--tx);font-size:16px;margin-bottom:4px}
.nav{position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.95);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--ln);padding:6px 16px calc(6px + env(safe-area-inset-bottom));z-index:20}
.nav-in{max-width:520px;margin:0 auto;display:flex;align-items:center;gap:8px}
.nav .t{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:12px;font-weight:700;color:var(--mu);padding:6px;border-radius:14px}
.nav .t svg{width:24px;height:24px}
.nav .t.on{color:var(--p)}
.nav .t.on svg{background:#EDE9FE;border-radius:10px;padding:3px;width:32px;height:28px}
.fab{width:60px;height:60px;border-radius:21px;background:linear-gradient(135deg,#6D28D9,#8B5CF6);color:#fff;display:grid;place-items:center;box-shadow:0 12px 26px -8px rgba(109,40,217,.75);margin-top:-34px;border:4px solid var(--bg)}
.fab svg{width:28px;height:28px}
.shbg{position:fixed;inset:0;background:rgba(20,10,40,.45);z-index:50;opacity:0;pointer-events:none;transition:opacity .2s}
.shbg.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;margin:0 auto;max-width:620px;background:#fff;border-radius:26px 26px 0 0;z-index:51;max-height:92vh;overflow:auto;transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.8,.2,1);padding:6px 18px calc(22px + env(safe-area-inset-bottom));visibility:hidden}
.sheet.on{transform:none;visibility:visible}
@media(min-width:720px){.sheet{bottom:auto;top:50%;border-radius:26px;transform:translateY(-46%) scale(.97);opacity:0;transition:.22s;max-height:88vh}.sheet.on{transform:translateY(-50%);opacity:1}}
.grab{width:44px;height:5px;background:var(--ln);border-radius:9px;margin:4px auto 14px}
.sh-h{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.sh-h h3{margin:0;flex:1;font-size:18px;font-weight:800;min-width:0}
.ib2{width:38px;height:38px;border-radius:13px;background:#F4F2FB;display:grid;place-items:center;color:var(--mu);flex:none}
.ib2 svg{width:20px;height:20px}
.fld{margin-bottom:13px}
.fld label{display:block;font-size:13px;font-weight:700;color:var(--mu);margin-bottom:6px}
.fld input,.fld textarea,.fld select{width:100%;border:1.5px solid var(--ln);border-radius:14px;padding:12px 14px;outline:0;background:#FBFAFF;transition:.15s;-webkit-appearance:none;appearance:none}
.fld select{background-image:linear-gradient(45deg,transparent 50%,var(--mu) 50%),linear-gradient(135deg,var(--mu) 50%,transparent 50%);background-position:18px 52%,13px 52%;background-size:5px 5px;background-repeat:no-repeat}
.fld textarea{min-height:76px;resize:vertical}
.fld input:focus,.fld textarea:focus,.fld select:focus{border-color:var(--p2);background:#fff;box-shadow:0 0 0 4px #EDE9FE}
.fld .money-in{font-size:22px;font-weight:800;direction:ltr;text-align:right}
.fld .hint{font-size:12px;color:var(--mu);margin-top:5px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.req{color:var(--rd)}
.ro{padding:12px 14px;border-radius:14px;background:#F6F4FD;font-weight:700;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.btn{width:100%;padding:14px;border-radius:15px;background:var(--p);color:#fff;font-weight:800;font-size:16px;display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 8px 18px -10px rgba(109,40,217,.8)}
.btn svg{width:20px;height:20px}
.btn.ghost{background:#F3F0FF;color:var(--p);box-shadow:none}
.btn.danger{background:var(--rdb);color:var(--rd);box-shadow:none}
.btn.dsolid{background:var(--rd);box-shadow:none}
.btn.sm{padding:11px;font-size:14px}
.btns{display:flex;gap:10px;margin-top:8px}
.mt{margin-top:12px}
.acts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:0 0 14px}
.act{display:flex;flex-direction:column;align-items:center;gap:4px;padding:11px 4px;border-radius:15px;background:#F6F4FD;font-size:12px;font-weight:700;color:var(--pd);text-decoration:none}
.act svg{width:22px;height:22px}
.act.dis{opacity:.4;pointer-events:none}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:#F8F7FC;border-radius:15px;padding:11px 6px;text-align:center;min-width:0}
.stat span{display:block;font-size:12px;color:var(--mu)}
.stat b{font-size:14.5px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.split{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.split div{border-radius:14px;padding:9px 12px;background:color-mix(in srgb,var(--c) 9%,#fff);border:1px solid color-mix(in srgb,var(--c) 22%,#fff);font-size:12px;color:var(--mu)}
.split b{display:block;font-size:14px;color:var(--tx)}
.notebox{display:flex;gap:8px;background:#FFFBEB;border:1px solid #FDE68A;color:#78350F;border-radius:14px;padding:10px 12px;font-size:14px;margin-top:12px;white-space:pre-wrap}
.notebox svg{width:18px;height:18px;margin-top:2px}
.mini{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--ln);width:100%;text-align:right}
.mini:last-child{border-bottom:0}
.mini .tx-ic{width:36px;height:36px;border-radius:12px}
.mini .tx-ic svg{width:17px;height:17px}
.sec{font-weight:800;font-size:14px;margin:18px 0 4px;display:flex;justify-content:space-between;align-items:center}
.sec span{color:var(--mu);font-weight:700;font-size:12px}
.menu-it{display:flex;align-items:center;gap:12px;padding:13px 4px;width:100%;text-align:right;font-weight:700;font-size:15px;border-bottom:1px solid var(--ln)}
.menu-it:last-child{border-bottom:0}
.menu-it .mic{width:40px;height:40px;border-radius:13px;background:#F3F0FF;color:var(--p);display:grid;place-items:center}
.menu-it .mic svg{width:20px;height:20px}
.menu-it small{display:block;color:var(--mu);font-weight:600;font-size:12px}
.menu-it.red{color:var(--rd)}.menu-it.red .mic{background:var(--rdb);color:var(--rd)}
.pcard{border-radius:18px;padding:14px;border:1.5px solid color-mix(in srgb,var(--c) 30%,#fff);background:color-mix(in srgb,var(--c) 6%,#fff);margin-bottom:10px}
.pcard .ln{display:flex;justify-content:space-between;font-size:14px;padding:4px 0}
.pcard .ln.tot{border-top:1px dashed color-mix(in srgb,var(--c) 35%,#fff);margin-top:6px;padding-top:8px;font-weight:800}
.settle{background:linear-gradient(135deg,#F5F3FF,#EDE9FE);border-radius:18px;padding:14px;font-size:14px;line-height:1.9}
.settle b{color:var(--pd)}
.toast{position:fixed;bottom:104px;left:50%;transform:translate(-50%,16px);background:#1F1B2E;color:#fff;padding:11px 18px;border-radius:13px;font-weight:700;opacity:0;transition:.25s;z-index:90;font-size:14px;pointer-events:none;max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
.cf{position:fixed;inset:0;background:rgba(20,10,40,.5);z-index:80;display:grid;place-items:center;padding:24px;animation:fi .15s}
.cf-b{background:#fff;border-radius:22px;padding:20px;max-width:360px;width:100%}
.cf-b p{margin:0 0 14px;font-weight:700;font-size:15.5px;line-height:1.7}
@keyframes fi{from{opacity:0}}
.auth{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 18px;background:linear-gradient(160deg,#3B0F7A,#6D28D9 55%,#A78BFA)}
.auth-card{background:#fff;border-radius:28px;padding:24px 20px;width:100%;max-width:420px;box-shadow:0 30px 60px -20px rgba(30,10,70,.6)}
.logo{width:84px;height:84px;margin:0 auto 10px;display:block;filter:drop-shadow(0 12px 20px rgba(30,10,70,.4))}
.auth h1{color:#fff;text-align:center;margin:0;font-size:26px;font-weight:800}
.auth .tag{color:rgba(255,255,255,.85);text-align:center;margin:2px 0 20px;font-size:14px}
.auth h2{margin:0 0 4px;font-size:18px}
.who{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0}
.who button{border:2px solid var(--ln);border-radius:20px;padding:18px 8px;display:flex;flex-direction:column;align-items:center;gap:8px;font-weight:800;font-size:15px;transition:.15s;min-width:0}
.who button .av{width:54px;height:54px;font-size:22px}
.who button.on{border-color:var(--p);background:#F5F3FF;box-shadow:0 0 0 4px #EDE9FE}
.who button span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pin{letter-spacing:14px;text-align:center !important;font-size:26px !important;font-weight:800;direction:ltr}
.shake{animation:sh .35s}
@keyframes sh{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.foot{color:rgba(255,255,255,.7);font-size:12px;margin-top:16px;text-align:center}
.spin{width:38px;height:38px;border:4px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:rt 1s linear infinite;margin:20px auto}
@keyframes rt{to{transform:rotate(360deg)}}
.fade{animation:fu .25s ease}
@keyframes fu{from{opacity:0;transform:translateY(6px)}}
</style>
</head>
<body>
<div id="root"><div class="auth"><div class="spin"></div></div></div>
<div class="shbg" id="shbg" onclick="closeSheet()"></div>
<div class="sheet" id="sheet"></div>
<div class="toast" id="toast"></div>
<input type="file" id="impfile" accept=".json,application/json" hidden>

<script>
/* =========================================================
   إعدادات المزامنة بين الشريكين (Firebase Firestore)
   اتركها null للعمل محلياً على جهاز واحد للتجربة.
   للمزامنة: ضع إعدادات مشروع Firebase هنا، مثال:
   const FIREBASE_CONFIG = {
     apiKey: "...", authDomain: "....firebaseapp.com",
     projectId: "...", storageBucket: "....appspot.com",
     messagingSenderId: "...", appId: "..."
   };
   ========================================================= */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyBQ_p1aJm60sNaRBZewlsIwewEQts_5b1M",
  authDomain: "sharek-eng-576dc.firebaseapp.com",
  projectId: "sharek-eng-576dc",
  storageBucket: "sharek-eng-576dc.firebasestorage.app",
  messagingSenderId: "832819470617",
  appId: "1:832819470617:web:40f8161d4668446bbfa588"
};

const APP_VER = '1.0.0';
const K = 'pledger_';
const COLS = ['customers', 'payments', 'expenses'];   // كل قسم في مجموعة بيانات مستقلة
const S = { customers: [], payments: [], expenses: [], settings: null };
const ui = { tab: 'in', sub: 'cust', q: '', fIn: 'all', fOut: 'all', sheet: null };
let me = null, DB = null, appShown = false, deferredInstall = null;

/* ---------- أدوات ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const ls = {
  get(k, d) { try { const v = localStorage.getItem(K + k); return v ? JSON.parse(v) : d } catch (e) { return d } },
  set(k, v) { try { localStorage.setItem(K + k, JSON.stringify(v)) } catch (e) { } },
  del(k) { try { localStorage.removeItem(K + k) } catch (e) { } }
};
const nowLocal = () => { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 16) };
const nowISO = () => new Date().toISOString();
const toEn = s => String(s ?? '').replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[۰-۹]/g, d => '۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/٫/g, '.').replace(/[,،\s]/g, '');
const num = v => { const n = parseFloat(toEn(v)); return isFinite(n) ? n : 0 };
const cur = () => (S.settings && S.settings.currency) || 'ج.م';
const fmtN = n => (Math.round((+n || 0) * 100) / 100).toLocaleString('en-US');
const money = n => fmtN(n) + ' ' + cur();
const dt = s => { const d = new Date(s); if (isNaN(d)) return ''; return d.toLocaleDateString('ar-EG-u-nu-latn', { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' }) + ' • ' + d.toLocaleTimeString('ar-EG-u-nu-latn', { hour: 'numeric', minute: '2-digit' }) };
const dayKey = s => String(s || '').slice(0, 10);
function dayLabel(k) {
  const t = nowLocal().slice(0, 10);
  const y = new Date(Date.now() - 864e5); y.setMinutes(y.getMinutes() - y.getTimezoneOffset());
  if (k === t) return 'اليوم';
  if (k === y.toISOString().slice(0, 10)) return 'أمس';
  const d = new Date(k + 'T12:00'); return isNaN(d) ? k : d.toLocaleDateString('ar-EG-u-nu-latn', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
}
const uname = u => (S.settings && S.settings.users && S.settings.users[u] && S.settings.users[u].name) || (u === 'u1' ? 'الشريك الأول' : 'الشريك الثاني');
const ucolor = u => u === 'u1' ? 'var(--a)' : 'var(--b)';
const initial = n => (String(n || '?').trim()[0] || '?');
const PAL = ['#7C3AED', '#0EA5E9', '#10B981', '#F59E0B', '#EC4899', '#6366F1', '#14B8A6', '#EF4444'];
const avColor = n => { let h = 0; for (const c of String(n)) h = (h * 31 + c.charCodeAt(0)) >>> 0; return PAL[h % PAL.length] };
const alive = a => a.filter(x => !x.deleted);
const sum = a => a.reduce((s, x) => s + (+x.amount || 0), 0);
const byDate = (a, b) => String(b.date).localeCompare(String(a.date));

/* ---------- الأيقونات ---------- */
const I = {
  plus: '<path d="M12 5v14M5 12h14"/>', menu: '<path d="M4 7h16M4 12h16M4 17h10"/>',
  search: '<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>',
  phone: '<path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/>',
  wa: '<path d="M3 21l1.7-5A8.5 8.5 0 1 1 8 19.3z"/><path d="M9 9.5c0 3 2.5 5.5 5.5 5.5l1-1.5-2-1-1 .8a4 4 0 0 1-1.8-1.8l.8-1-1-2z"/>',
  share: '<circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.6 13.5 6.8 4M15.4 6.5l-6.8 4"/>',
  edit: '<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>',
  trash: '<path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/>', x: '<path d="M18 6 6 18M6 6l12 12"/>',
  back: '<path d="m9 18 6-6-6-6"/>',
  in: '<path d="M12 4v12M6 10l6 6 6-6"/><path d="M5 20h14"/>', out: '<path d="M12 20V8M6 14l6-6 6 6"/><path d="M5 4h14"/>',
  users: '<circle cx="9" cy="8" r="4"/><path d="M2 21a7 7 0 0 1 14 0"/><path d="M16 4a4 4 0 0 1 0 8M22 21a7 7 0 0 0-4-6.3"/>',
  chart: '<path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 5-6"/>',
  gear: '<path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1"/><circle cx="15" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="18" r="2"/>',
  download: '<path d="M12 3v12M7 10l5 5 5-5M5 21h14"/>', upload: '<path d="M12 15V3M7 8l5-5 5 5M5 21h14"/>',
  restore: '<path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/>',
  logout: '<path d="M9 4H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h3"/><path d="M14 7l5 5-5 5M19 12H9"/>',
  note: '<path d="M4 4h16v12l-4 4H4z"/><path d="M8 9h8M8 13h5"/>',
  install: '<rect x="6" y="2" width="12" height="20" rx="2"/><path d="M12 7v7M9 11l3 3 3-3"/>',
  wallet: '<rect x="2" y="6" width="20" height="14" rx="3"/><path d="M16 13h2M6 6V4h12v2"/>',
  file: '<path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6M8 13h8M8 17h5"/>',
  lock: '<rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>'
};
const ic = n => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${I[n]}</svg>`;
const LOGO = `<svg class="logo" viewBox="0 0 96 96"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#EDE9FE"/></linearGradient></defs><rect x="4" y="4" width="88" height="88" rx="26" fill="url(#lg)"/><rect x="22" y="20" width="52" height="58" rx="10" fill="#6D28D9"/><rect x="22" y="20" width="10" height="58" rx="5" fill="#4C1D95"/><path d="M44 38v14m-5-5 5 5 5-5" stroke="#6EE7B7" stroke-width="4.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M60 52V38m-5 5 5-5 5 5" stroke="#FCA5A5" stroke-width="4.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="38" y="60" width="28" height="5" rx="2.5" fill="#C4B5FD"/></svg>`;

/* ---------- طبقة البيانات: محلي ---------- */
const Local = {
  name: 'local',
  init(cb) {
    COLS.forEach(c => S[c] = ls.get('col_' + c, []));
    S.settings = ls.get('settings', null);
    cb();
  },
  put(c, o) { const a = S[c]; const i = a.findIndex(x => x.id === o.id); if (i >= 0) a[i] = o; else a.push(o); ls.set('col_' + c, a); render() },
  setSettings(o) { S.settings = o; ls.set('settings', o); render() }
};

/* ---------- طبقة البيانات: سحابي (Firestore) ---------- */
let fs = null;
const Cloud = {
  name: 'cloud',
  init(cb) {
    firebase.initializeApp(FIREBASE_CONFIG);
    fs = firebase.firestore();
    fs.enablePersistence({ synchronizeTabs: true }).catch(() => { });
    let pending = COLS.length + 1, called = false;
    const ready = () => { if (--pending <= 0 && !called) { called = true; cb() } };
    COLS.forEach(c => {
      let first = true;
      fs.collection(c).onSnapshot(snap => {
        S[c] = snap.docs.map(d => d.data());
        if (first) { first = false; ready() } else render();
      }, err => { console.error(err); toast('خطأ في المزامنة: ' + err.code); if (first) { first = false; ready() } });
    });
    let firstS = true;
    fs.collection('meta').doc('settings').onSnapshot(d => {
      S.settings = d.exists ? d.data() : null;
      if (firstS) { firstS = false; ready() } else { if (!appShown) start(); else render() }
    }, err => { console.error(err); if (firstS) { firstS = false; ready() } });
  },
  put(c, o) { fs.collection(c).doc(o.id).set(JSON.parse(JSON.stringify(o))).catch(e => toast('تعذّر الحفظ: ' + e.code)) },
  setSettings(o) { S.settings = o; fs.collection('meta').doc('settings').set(o).catch(e => toast('تعذّر الحفظ: ' + e.code)) }
};

function loadScript(src) { return new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = rej; document.head.appendChild(s) }) }

/* ---------- الحفظ والحذف (الحذف ناعم: لا يُمسح شيء نهائياً) ---------- */
function save(col, o) { o.updatedAt = nowISO(); o.updatedBy = me; DB.put(col, o) }
function softDel(col, o, msg) { save(col, { ...o, deleted: true, deletedAt: nowISO(), deletedBy: me }); toast(msg || 'تم الحذف — يمكن استرجاعه من «المحذوفات»') }

/* ---------- استعلامات ---------- */
const custs = () => alive(S.customers);
const custById = id => S.customers.find(x => x.id === id);
const pays = () => alive(S.payments).filter(p => { const c = custById(p.customerId); return !c || !c.deleted });
const exps = () => alive(S.expenses);
const paidOf = cid => sum(pays().filter(p => p.customerId === cid));
const lastAct = c => { const ps = pays().filter(p => p.customerId === c.id).map(p => p.date || ''); return [c.createdAt || '', ...ps].sort().pop() };

/* ---------- واجهة عامة ---------- */
let tT;
function toast(m) { const t = $('#toast'); t.textContent = m; t.classList.add('on'); clearTimeout(tT); tT = setTimeout(() => t.classList.remove('on'), 2600) }
function sheet(html, refresh) {
  const s = $('#sheet'), b = $('#shbg');
  ui.sheet = refresh ? { refresh } : {};
  const st = s.scrollTop;
  s.innerHTML = '<div class="grab"></div>' + html;
  if (!s.classList.contains('on')) {
    s.scrollTop = 0; s.classList.add('on'); b.classList.add('on');
    try { history.pushState({ sh: 1 }, '') } catch (e) { }
  } else if (refresh && refresh._same) s.scrollTop = st;
  const f = s.querySelector('[autofocus]'); if (f && matchMedia('(min-width:720px)').matches) setTimeout(() => f.focus(), 250);
}
function hideSheet() { ui.sheet = null; $('#sheet').classList.remove('on'); $('#shbg').classList.remove('on') }
function closeSheet() {
  if ($('#sheet').classList.contains('on')) { try { if (history.state && history.state.sh) { history.back(); return } } catch (e) { } }
  hideSheet();
}
window.addEventListener('popstate', () => { if ($('#sheet').classList.contains('on')) hideSheet() });
function confirmBox(msg, yes, label) {
  const d = document.createElement('div'); d.className = 'cf';
  d.innerHTML = `<div class="cf-b"><p>${msg}</p><div class="btns"><button class="btn ghost" data-n>إلغاء</button><button class="btn dsolid" data-y>${label || 'حذف'}</button></div></div>`;
  document.body.appendChild(d);
  d.querySelector('[data-n]').onclick = () => d.remove();
  d.querySelector('[data-y]').onclick = () => { d.remove(); yes() };
  d.onclick = e => { if (e.target === d) d.remove() };
}
const ubadge = u => `<span class="ub" style="--c:${ucolor(u)}"><i>${esc(initial(uname(u)))}</i>${esc(uname(u))}</span>`;
const emptyBox = (icon, t, s) => `<div class="empty fade"><div class="eic">${ic(icon)}</div><b>${t}</b>${s}</div>`;

/* ---------- الإعداد الأول ---------- */
function showSetup() {
  appShown = false;
  $('#root').innerHTML = `<div class="auth fade">${LOGO}<h1>دفتر الشراكة</h1><p class="tag">إعداد التطبيق لأول مرة</p>
  <div class="auth-card">
    <h2>بيانات الشريكين</h2><p class="mu" style="margin:0 0 14px">يدخل كل شريك باسمه ورمزه، وتُسجَّل كل عملية باسم من أدخلها.</p>
    <div class="two"><div class="fld"><label>اسم الشريك الأول <span class="req">*</span></label><input id="s_n1" maxlength="30"></div>
    <div class="fld"><label>رمز الدخول (4 أرقام)</label><input id="s_p1" class="pin" inputmode="numeric" maxlength="4" type="password"></div></div>
    <div class="two"><div class="fld"><label>اسم الشريك الثاني <span class="req">*</span></label><input id="s_n2" maxlength="30"></div>
    <div class="fld"><label>رمز الدخول (4 أرقام)</label><input id="s_p2" class="pin" inputmode="numeric" maxlength="4" type="password"></div></div>
    <div class="two"><div class="fld"><label>العملة</label><input id="s_cur" value="ج.م" maxlength="8"></div>
    <div class="fld"><label>مفتاح الدولة للواتساب</label><input id="s_cc" value="20" inputmode="numeric" maxlength="4"></div></div>
    <button class="btn" onclick="doSetup()">${ic('lock')} حفظ والبدء</button>
  </div><div class="foot">${DB.name === 'cloud' ? 'البيانات تُزامَن بين الشريكين تلقائياً' : 'وضع محلي: البيانات محفوظة على هذا الجهاز'}</div></div>`;
}
function doSetup() {
  const n1 = $('#s_n1').value.trim(), n2 = $('#s_n2').value.trim(), p1 = toEn($('#s_p1').value), p2 = toEn($('#s_p2').value);
  if (!n1 || !n2) return toast('اكتب اسمي الشريكين');
  if (!/^\d{4}$/.test(p1) || !/^\d{4}$/.test(p2)) return toast('رمز الدخول يجب أن يكون 4 أرقام لكل شريك');
  DB.setSettings({ users: { u1: { name: n1, pin: p1 }, u2: { name: n2, pin: p2 } }, currency: $('#s_cur').value.trim() || 'ج.م', cc: toEn($('#s_cc').value) || '20', createdAt: nowISO() });

/* ---------- الدخول ---------- */
let pick = null;
function showLogin() {
  appShown = false; pick = null;
  $('#root').innerHTML = `<div class="auth fade">${LOGO}<h1>دفتر الشراكة</h1><p class="tag">حسابات العملاء والمصروفات</p>
  <div class="auth-card"><h2>مَن يستخدم التطبيق الآن؟</h2><p class="mu" style="margin:0">اختر اسمك ثم اكتب رمز الدخول</p>
  <div class="who">${['u1', 'u2'].map(u => `<button id="w_${u}" onclick="pickUser('${u}')"><div class="av" style="background:${ucolor(u)}">${esc(initial(uname(u)))}</div><span>${esc(uname(u))}</span></button>`).join('')}</div>
  <div id="pinbox" style="display:none"><div class="fld"><label id="pinlbl">رمز الدخول</label><input id="pin" class="pin" type="password" inputmode="numeric" maxlength="4" autocomplete="off"></div>
  <button class="btn" onclick="tryLogin()">دخول</button></div></div>
  <div class="foot">الإصدار ${APP_VER}</div></div>`;
}
function pickUser(u) {
  pick = u; ['u1', 'u2'].forEach(x => $('#w_' + x).classList.toggle('on', x === u));
  $('#pinbox').style.display = ''; $('#pinlbl').textContent = 'رمز الدخول لـ ' + uname(u);
  const p = $('#pin'); p.value = ''; p.focus();
  p.oninput = () => { if (toEn(p.value).length === 4) tryLogin() };
  p.onkeydown = e => { if (e.key === 'Enter') tryLogin() };
}
function tryLogin() {
  if (!pick) return toast('اختر اسمك أولاً');
  const v = toEn($('#pin').value), ok = S.settings.users[pick].pin;
  if (ok && v !== ok) { const c = $('.auth-card'); c.classList.remove('shake'); void c.offsetWidth; c.classList.add('shake'); $('#pin').value = ''; return toast('رمز الدخول غير صحيح') }
  me = pick; ls.set('me', me); showApp();
}
function logout() { confirmBox('تسجيل الخروج من هذا الجهاز؟', () => { hideSheet(); me = null; ls.del('me'); showLogin() }, 'خروج') }

/* ---------- التطبيق ---------- */
function showApp() {
  appShown = true;
  $('#root').innerHTML = `<header class="top"><div class="bar">
    <button class="ibtn" onclick="openMenu()" aria-label="القائمة">${ic('menu')}</button>
    <div class="ttl"><b>دفتر الشراكة</b><small id="sync"></small></div>
    <button class="chip-me" onclick="openMenu()"><div class="av" style="background:${ucolor(me)};width:30px;height:30px">${esc(initial(uname(me)))}</div><span id="mename"></span></button>
  </div><div class="hero" id="hero"></div></header>
  <main class="main" id="main"></main>
  <nav class="nav"><div class="nav-in">
    <button class="t" id="t_in" onclick="setTab('in')">${ic('in')}المدخلات</button>
    <button class="fab" onclick="fabAct()" aria-label="إضافة">${ic('plus')}</button>
    <button class="t" id="t_out" onclick="setTab('out')">${ic('out')}المصروفات</button>
  </div></nav>`;
  render();
}
function setTab(t) { ui.tab = t; render(); scrollTo({ top: 0, behavior: 'smooth' }) }
function setSub(s) { ui.sub = s; render() }
function fabAct() { if (ui.tab === 'out') expForm(); else if (ui.sub === 'pays') payForm(); else custForm() }

function syncHtml() {
  if (DB.name === 'local') return '<span class="dot loc"></span>وضع محلي — على هذا الجهاز فقط';
  return navigator.onLine ? '<span class="dot"></span>متزامن مع الشريك' : '<span class="dot off"></span>غير متصل — ستتم المزامنة عند عودة الاتصال';
}

function render() {
  if (!appShown) return;
  if (!S.settings || !S.settings.users[me]) return start();
  $('#sync').innerHTML = syncHtml();
  $('#mename').textContent = uname(me);
  $('#t_in').classList.toggle('on', ui.tab === 'in');
  $('#t_out').classList.toggle('on', ui.tab === 'out');
  renderHero(); renderMain();
  if (ui.sheet && ui.sheet.refresh) ui.sheet.refresh();
}

function renderHero() {
  const h = $('#hero');
  if (ui.tab === 'in') {
    const cs = custs(), ps = pays(), paid = sum(ps);
    const tot = cs.reduce((s, c) => s + (+c.total || 0), 0);
    const rem = cs.reduce((s, c) => { const r = (+c.total || 0) - paidOf(c.id); return s + (r > 0 ? r : 0) }, 0);
    h.innerHTML = `<div class="lbl">إجمالي الواصل من العملاء</div><div class="big">${money(paid)}</div>
    <div class="hint">إجمالي الحسابات ${money(tot)} • المتبقي <b>${money(rem)}</b></div>
    <div class="sub">${['u1', 'u2'].map(u => `<div class="pill" style="--c:${ucolor(u)}"><span><i></i>واصل لـ ${esc(uname(u))}</span><b>${money(sum(ps.filter(p => p.user === u)))}</b></div>`).join('')}</div>`;
  } else {
    const es = exps();
    h.innerHTML = `<div class="lbl">إجمالي المصروفات</div><div class="big">${money(sum(es))}</div>
    <div class="hint">${es.length} عملية مسجّلة</div>
    <div class="sub">${['u1', 'u2'].map(u => `<div class="pill" style="--c:${ucolor(u)}"><span><i></i>صرف ${esc(uname(u))}</span><b>${money(sum(es.filter(e => e.user === u)))}</b></div>`).join('')}</div>`;
  }
}

function chipsHtml(key) {
  const v = ui[key];
  return `<div class="chips">${[['all', 'الكل'], ['u1', uname('u1')], ['u2', uname('u2')]].map(([k, l]) => `<button class="${v === k ? 'on' : ''}" onclick="ui.${key}='${k}';render()">${esc(l)}</button>`).join('')}</div>`;
}

function renderMain() {
  const m = $('#main');
  const keep = document.activeElement && document.activeElement.id === 'q';
  let h = '';
  if (ui.tab === 'in') {
    h += `<div class="seg"><button class="${ui.sub === 'cust' ? 'on' : ''}" onclick="setSub('cust')">العملاء</button><button class="${ui.sub === 'pays' ? 'on' : ''}" onclick="setSub('pays')">سجل الدفعات</button></div>`;
    if (ui.sub === 'cust') {
      const q = ui.q.trim().toLowerCase();
      let cs = custs();
      if (q) cs = cs.filter(c => [c.name, c.phone, c.address, c.notes].some(v => String(v || '').toLowerCase().includes(q)));
      cs.sort((a, b) => lastAct(b).localeCompare(lastAct(a)));
      h += `<div class="search">${ic('search')}<input id="q" placeholder="ابحث بالاسم أو الجوال أو العنوان" value="${esc(ui.q)}" oninput="ui.q=this.value;renderMain()"></div>`;
      if (!custs().length) h += emptyBox('users', 'لا يوجد عملاء بعد', 'اضغط زر <b style="display:inline;color:var(--p)">+</b> لإضافة أول عميل');
      else if (!cs.length) h += emptyBox('search', 'لا توجد نتائج', 'جرّب كلمة بحث أخرى');
      else h += `<div class="list cust">${cs.map(custCard).join('')}</div>`;
    } else {
      h += chipsHtml('fIn');
      let ps = pays(); if (ui.fIn !== 'all') ps = ps.filter(p => p.user === ui.fIn);
      h += ps.length ? grouped(ps, 'in') : emptyBox('in', 'لا توجد دفعات', 'سجّل الدفعات من صفحة العميل أو بزر +');
    }
  } else {
    h += chipsHtml('fOut');
    let es = exps(); if (ui.fOut !== 'all') es = es.filter(e => e.user === ui.fOut);
    h += es.length ? grouped(es, 'out') : emptyBox('out', 'لا توجد مصروفات', 'اضغط زر + لتسجيل مصروف');
  }
  m.innerHTML = h;
  if (keep) { const q = $('#q'); q.focus(); q.setSelectionRange(q.value.length, q.value.length) }
}

function custCard(c) {
  const paid = paidOf(c.id), tot = +c.total || 0, rem = tot - paid;
  const pct = tot > 0 ? Math.min(100, paid / tot * 100) : 0;
  let st = '';
  if (tot > 0 && rem <= 0) st = '<span class="badge bg">مُسدَّد</span>';
  else if (tot > 0 && paid > 0) st = `<span class="badge bv">${Math.round(pct)}%</span>`;
  else if (tot > 0) st = '<span class="badge br">لم يدفع</span>';
  return `<button class="card fade" onclick="openCust('${c.id}')">
    <div class="row"><div class="av" style="background:${avColor(c.name)};width:44px;height:44px;border-radius:15px;font-size:17px">${esc(initial(c.name))}</div>
    <div class="grow"><div class="nm">${esc(c.name)}</div><div class="mu ell">${esc(c.phone || c.address || 'بدون بيانات تواصل')}</div></div>${st}</div>
    ${tot > 0 ? `<div class="prog"><i style="width:${pct}%"></i></div>` : '<div style="height:12px"></div>'}
    <div class="nums"><span class="mu">الواصل <b class="g">${money(paid)}</b></span>
    ${tot > 0 ? (rem >= 0 ? `<span class="mu">المتبقي <b class="${rem > 0 ? 'r' : ''}">${money(rem)}</b></span>` : `<span class="mu">زيادة <b class="g">${money(-rem)}</b></span>`) : '<span class="mu">لم يُحدَّد إجمالي الحساب</span>'}</div>
  </button>`;
}

function txItem(kind, o) {
  const isIn = kind === 'in', c = isIn ? custById(o.customerId) : (o.customerId ? custById(o.customerId) : null);
  const title = isIn ? (c ? c.name : 'عميل') : o.title;
  const click = isIn ? `openCust('${o.customerId}')` : `openExp('${o.id}')`;
  return `<button class="card fade" onclick="${click}">
    <div class="row"><div class="tx-ic ${isIn ? 'gi' : 'ri'}">${ic(isIn ? 'in' : 'out')}</div>
    <div class="grow"><div class="nm">${esc(title)}</div><div class="mu">${dt(o.date)}</div></div>
    <div class="amt ${isIn ? 'g' : 'r'}">${isIn ? '+' : '−'}${fmtN(o.amount)}</div></div>
    <div class="tx-f">${ubadge(o.user)}${!isIn && c && !c.deleted ? `<span class="badge bv">${esc(c.name)}</span>` : ''}${o.note ? `<span class="mu ell">${esc(o.note)}</span>` : ''}</div>
  </button>`;
}
function grouped(arr, kind) {
  const s = [...arr].sort(byDate); let h = '', last = null;
  for (const o of s) {
    const k = dayKey(o.date);
    if (k !== last) { h += `<div class="day"><span>${dayLabel(k)}</span><b>${money(sum(s.filter(x => dayKey(x.date) === k)))}</b></div>`; last = k }
    h += txItem(kind, o);
  }
  return `<div class="list">${h}</div>`;
}

/* ---------- العميل ---------- */
function waNum(p) {
  let d = toEn(p).replace(/[^\d+]/g, '');
  if (!d) return '';
  if (d.startsWith('+')) return d.slice(1);
  if (d.startsWith('00')) return d.slice(2);
  const cc = (S.settings && S.settings.cc) || '20';
  if (d.startsWith('0')) return cc + d.slice(1);
  return d.startsWith(cc) ? d : cc + d;
}
function statementText(c) {
  const ps = pays().filter(p => p.customerId === c.id).sort((a, b) => String(a.date).localeCompare(String(b.date)));
  const paid = sum(ps), tot = +c.total || 0;
  let t = `*كشف حساب: ${c.name}*\n`;
  if (tot > 0) t += `إجمالي الحساب: ${money(tot)}\n`;
  t += `إجمالي المدفوع: ${money(paid)}\n`;
  if (tot > 0) t += `المتبقي: ${money(Math.max(tot - paid, 0))}\n`;
  if (ps.length) { t += `\n*الدفعات:*\n`; ps.forEach((p, i) => t += `${i + 1}) ${dt(p.date)} — ${money(p.amount)}${p.note ? ' (' + p.note + ')' : ''}\n`) }
  return t + `\nشكراً لتعاملكم معنا`;
}
function shareStatement(id) {
  const c = custById(id), t = statementText(c);
  if (navigator.share) navigator.share({ title: 'كشف حساب ' + c.name, text: t }).catch(() => { });
  else if (navigator.clipboard) navigator.clipboard.writeText(t).then(() => toast('تم نسخ كشف الحساب'));
}
function openCust(id) {
  const c = custById(id);
  if (!c || c.deleted) { hideSheet(); return }
  const ps = pays().filter(p => p.customerId === id).sort(byDate);
  const paid = sum(ps), tot = +c.total || 0, rem = tot - paid;
  const ex = exps().filter(e => e.customerId === id).sort(byDate);
  const wa = waNum(c.phone);
  const refresh = () => openCust(id); refresh._same = true;
  sheet(`<div class="sh-h"><div class="av lg" style="background:${avColor(c.name)}">${esc(initial(c.name))}</div>
    <div class="grow"><h3 class="ell">${esc(c.name)}</h3><div class="mu ell">${esc([c.phone, c.address].filter(Boolean).join(' • ') || 'بدون بيانات تواصل')}</div></div>
    <button class="ib2" onclick="closeSheet()">${ic('x')}</button></div>
  <div class="acts">
    <a class="act ${c.phone ? '' : 'dis'}" href="tel:${esc(toEn(c.phone))}">${ic('phone')}اتصال</a>
    <a class="act ${wa ? '' : 'dis'}" href="https://wa.me/${wa}?text=${encodeURIComponent(statementText(c))}" target="_blank" rel="noopener">${ic('wa')}واتساب</a>
    <button class="act" onclick="shareStatement('${id}')">${ic('share')}كشف حساب</button>
    <button class="act" onclick="custForm('${id}')">${ic('edit')}تعديل</button>
  </div>
  <div class="stats"><div class="stat"><span>إجمالي الحساب</span><b>${tot > 0 ? money(tot) : '—'}</b></div>
    <div class="stat"><span>الواصل</span><b class="g">${money(paid)}</b></div>
    <div class="stat"><span>${rem < 0 ? 'زيادة' : 'المتبقي'}</span><b class="${rem > 0 ? 'r' : 'g'}">${tot > 0 ? money(Math.abs(rem)) : '—'}</b></div></div>
  ${tot > 0 ? `<div class="prog"><i style="width:${Math.min(100, paid / tot * 100)}%"></i></div>` : ''}
  <div class="split">${['u1', 'u2'].map(u => `<div style="--c:${ucolor(u)}">واصل لـ ${esc(uname(u))}<b>${money(sum(ps.filter(p => p.user === u)))}</b></div>`).join('')}</div>
  ${c.notes ? `<div class="notebox">${ic('note')}<div>${esc(c.notes)}</div></div>` : ''}
  <button class="btn mt" onclick="payForm('','${id}')">${ic('plus')} تسجيل دفعة واصلة</button>
  <div class="sec">الدفعات <span>${ps.length} دفعة</span></div>
  ${ps.length ? ps.map(p => `<button class="mini" onclick="payForm('${p.id}')"><div class="tx-ic gi">${ic('in')}</div>
    <div class="grow"><div style="font-weight:700">${money(p.amount)}</div><div class="mu">${dt(p.date)}${p.note ? ' • ' + esc(p.note) : ''}</div></div>${ubadge(p.user)}</button>`).join('') : '<div class="mu" style="padding:10px 0">لم تُسجَّل أي دفعة بعد</div>'}
  ${ex.length ? `<div class="sec">مصروفات على هذا العميل <span>${money(sum(ex))}</span></div>` + ex.map(e => `<button class="mini" onclick="openExp('${e.id}')"><div class="tx-ic ri">${ic('out')}</div>
    <div class="grow"><div style="font-weight:700">${esc(e.title)} — ${money(e.amount)}</div><div class="mu">${dt(e.date)}</div></div>${ubadge(e.user)}</button>`).join('') : ''}
  <div class="mu" style="font-size:12px;margin-top:14px">أُضيف بواسطة ${esc(uname(c.createdBy))} • ${dt(c.createdAt)}</div>
  <button class="btn danger sm mt" onclick="delCust('${id}')">${ic('trash')} حذف العميل</button>`, refresh);
}
function custForm(id) {
  const c = id ? custById(id) : null;
  sheet(`<div class="sh-h">${c ? `<button class="ib2" onclick="openCust('${id}')">${ic('back')}</button>` : ''}<h3>${c ? 'تعديل بيانات العميل' : 'عميل جديد'}</h3>${c ? '' : `<button class="ib2" onclick="closeSheet()">${ic('x')}</button>`}</div>
  <div class="fld"><label>اسم العميل <span class="req">*</span></label><input id="f_name" value="${esc(c?.name)}" maxlength="60" autofocus></div>
  <div class="two"><div class="fld"><label>رقم الجوال</label><input id="f_phone" value="${esc(c?.phone)}" type="tel" inputmode="tel" dir="ltr" style="text-align:right"></div>
  <div class="fld"><label>إجمالي الحساب</label><input id="f_total" value="${c && c.total ? c.total : ''}" inputmode="decimal" placeholder="0"></div></div>
  <div class="fld"><label>العنوان</label><input id="f_addr" value="${esc(c?.address)}"></div>
  <div class="fld"><label>ملاحظات</label><textarea id="f_notes">${esc(c?.notes)}</textarea></div>
  ${c ? '' : `<div class="fld"><label>دفعة أولى واصلة (اختياري)</label><input id="f_first" inputmode="decimal" placeholder="0"><div class="hint">ستُسجَّل باسمك: ${esc(uname(me))}</div></div>`}
  <button class="btn" onclick="saveCust('${id || ''}')">حفظ</button>`);
}
function saveCust(id) {
  const name = $('#f_name').value.trim();
  if (!name) { $('#f_name').focus(); return toast('اسم العميل مطلوب') }
  const old = id ? custById(id) : null;
  const o = old ? { ...old } : { id: uid(), createdAt: nowISO(), createdBy: me };
  Object.assign(o, { name, phone: $('#f_phone').value.trim(), address: $('#f_addr').value.trim(), notes: $('#f_notes').value.trim(), total: num($('#f_total').value) });
  save('customers', o);
  if (!old) { const f = num($('#f_first').value); if (f > 0) save('payments', { id: uid(), customerId: o.id, amount: f, date: nowLocal(), note: 'دفعة أولى', user: me, createdAt: nowISO(), createdBy: me }) }
  toast(old ? 'تم تحديث بيانات العميل' : 'تمت إضافة العميل');
  openCust(o.id);
}
function delCust(id) {
  const c = custById(id), n = pays().filter(p => p.customerId === id).length;
  confirmBox(`حذف العميل «${esc(c.name)}»${n ? ` ومعه ${n} دفعة من الحسابات` : ''}؟<br><span class="mu">يمكن استرجاعه لاحقاً من «المحذوفات».</span>`, () => { softDel('customers', c); closeSheet() });
}

/* ---------- الدفعات ---------- */
function payForm(pid, cid) {
  const p = pid ? S.payments.find(x => x.id === pid) : null;
  if (p && p.user !== me) return toast(`هذه الدفعة مسجّلة باسم ${uname(p.user)} — التعديل له فقط`);
  cid = cid || (p && p.customerId) || '';
  const cs = custs().sort((a, b) => a.name.localeCompare(b.name, 'ar'));
  if (!cs.length) { toast('أضف عميلاً أولاً'); return custForm() }
  const c = cid ? custById(cid) : null;
  const remTxt = cc => { const t = +cc.total || 0; return t > 0 ? 'المتبقي ' + money(Math.max(t - paidOf(cc.id), 0)) : '' };
  sheet(`<div class="sh-h">${cid ? `<button class="ib2" onclick="openCust('${cid}')">${ic('back')}</button>` : ''}<h3>${p ? 'تعديل الدفعة' : 'تسجيل دفعة واصلة'}</h3>${cid ? '' : `<button class="ib2" onclick="closeSheet()">${ic('x')}</button>`}</div>
  <div class="fld">${ubadge(me)} <span class="mu">تُسجَّل الدفعة باسمك</span></div>
  ${c && !p ? `<div class="fld"><label>العميل</label><div class="ro"><span>${esc(c.name)}</span><span class="mu">${remTxt(c)}</span></div><input type="hidden" id="f_c" value="${cid}"></div>`
      : `<div class="fld"><label>العميل <span class="req">*</span></label><select id="f_c"><option value="">— اختر العميل —</option>${cs.map(x => `<option value="${x.id}" ${x.id === cid ? 'selected' : ''}>${esc(x.name)}${remTxt(x) ? ' — ' + remTxt(x) : ''}</option>`).join('')}</select></div>`}
  <div class="fld"><label>المبلغ الواصل (${esc(cur())}) <span class="req">*</span></label><input id="f_amt" class="money-in" inputmode="decimal" value="${p ? p.amount : ''}" placeholder="0" autofocus></div>
  <div class="fld"><label>التاريخ والوقت</label><input id="f_date" type="datetime-local" value="${p ? p.date : nowLocal()}"></div>
  <div class="fld"><label>ملاحظة</label><input id="f_note" value="${esc(p?.note)}" placeholder="مثال: نقداً / تحويل بنكي"></div>
  <button class="btn" onclick="savePay('${pid || ''}')">حفظ الدفعة</button>
  ${p ? `<button class="btn danger sm mt" onclick="delPay('${pid}')">${ic('trash')} حذف الدفعة</button>` : ''}`);
}
function savePay(pid) {
  const cid = $('#f_c').value, amt = num($('#f_amt').value);
  if (!cid) return toast('اختر العميل');
  if (!(amt > 0)) { $('#f_amt').focus(); return toast('اكتب المبلغ') }
  const old = pid ? S.payments.find(x => x.id === pid) : null;
  const o = old ? { ...old } : { id: uid(), user: me, createdAt: nowISO(), createdBy: me };
  Object.assign(o, { customerId: cid, amount: amt, date: $('#f_date').value || nowLocal(), note: $('#f_note').value.trim() });
  save('payments', o); toast(old ? 'تم تعديل الدفعة' : 'تم تسجيل الدفعة ✓'); openCust(cid);
}
function delPay(pid) {

/* ---------- المصروفات ---------- */
function openExp(id) {
  const e = S.expenses.find(x => x.id === id); if (!e) return;
  if (e.user === me) return expForm(id);
  const c = e.customerId ? custById(e.customerId) : null;
  sheet(`<div class="sh-h"><div class="tx-ic ri">${ic('out')}</div><h3>${esc(e.title)}</h3><button class="ib2" onclick="closeSheet()">${ic('x')}</button></div>
  <div class="stats" style="grid-template-columns:1fr 1fr"><div class="stat"><span>المبلغ</span><b class="r">${money(e.amount)}</b></div><div class="stat"><span>بواسطة</span><b>${esc(uname(e.user))}</b></div></div>
  <div class="ro mt"><span>التاريخ</span><span>${dt(e.date)}</span></div>
  ${c ? `<div class="ro mt"><span>على العميل</span><span>${esc(c.name)}</span></div>` : ''}
  ${e.note ? `<div class="notebox">${ic('note')}<div>${esc(e.note)}</div></div>` : ''}
  <p class="mu" style="text-align:center;margin:16px 0 0">${ic('lock').replace('<svg', '<svg width="14" height="14" style="vertical-align:-2px"')} التعديل متاح لمن سجّل المصروف فقط</p>`);
}
function expForm(id) {
  const e = id ? S.expenses.find(x => x.id === id) : null;
  const cs = custs().sort((a, b) => a.name.localeCompare(b.name, 'ar'));
  sheet(`<div class="sh-h"><h3>${e ? 'تعديل المصروف' : 'تسجيل مصروف'}</h3><button class="ib2" onclick="closeSheet()">${ic('x')}</button></div>
  <div class="fld">${ubadge(me)} <span class="mu">يُسجَّل المصروف على حسابك</span></div>
  <div class="fld"><label>البيان <span class="req">*</span></label><input id="f_title" value="${esc(e?.title)}" placeholder="مثال: خامات، مواصلات، أجرة عامل" autofocus></div>
  <div class="fld"><label>المبلغ (${esc(cur())}) <span class="req">*</span></label><input id="f_amt" class="money-in" inputmode="decimal" value="${e ? e.amount : ''}" placeholder="0"></div>
  <div class="fld"><label>التاريخ والوقت</label><input id="f_date" type="datetime-local" value="${e ? e.date : nowLocal()}"></div>

function saveExp(id) {
  const title = $('#f_title').value.trim(), amt = num($('#f_amt').value);
  if (!title) { $('#f_title').focus(); return toast('اكتب بيان المصروف') }
  if (!(amt > 0)) { $('#f_amt').focus(); return toast('اكتب المبلغ') }
  const old = id ? S.expenses.find(x => x.id === id) : null;
  const o = old ? { ...old } : { id: uid(), user: me, createdAt: nowISO(), createdBy: me };
  Object.assign(o, { title, amount: amt, date: $('#f_date').value || nowLocal(), customerId: $('#f_c') ? $('#f_c').value : '', note: $('#f_note').value.trim() });
  save('expenses', o); toast(old ? 'تم تعديل المصروف' : 'تم تسجيل المصروف ✓'); closeSheet();
  if (ui.tab !== 'out') setTab('out');
}
function delExp(id) {
  const e = S.expenses.find(x => x.id === id);
  confirmBox(`حذف المصروف «${esc(e.title)}» بمبلغ ${money(e.amount)}؟`, () => { softDel('expenses', e); closeSheet() });
}

  ${deferredInstall ? it('install', 'تثبيت التطبيق على الجهاز', 'يعمل كتطبيق مستقل بأيقونة', 'doInstall()') : ''}

  ${it('upload', 'استعادة نسخة احتياطية', 'دمج بيانات من ملف سابق', "$('#impfile').click()")}
  ${it('logout', 'تسجيل الخروج', 'للتبديل إلى الشريك الآخر', 'logout()', 'red')}
  <div class="mu" style="text-align:center;font-size:12px;margin-top:10px">دفتر الشراكة • الإصدار ${APP_VER}</div>`);
}
function openSummary() {
  const ps = pays(), es = exps();
  const d = {}; ['u1', 'u2'].forEach(u => { const r = sum(ps.filter(p => p.user === u)), s = sum(es.filter(e => e.user === u)); d[u] = { r, s, n: r - s } });
  const totR = d.u1.r + d.u2.r, totS = d.u1.s + d.u2.s, profit = totR - totS, half = profit / 2;
  const diff = d.u1.n - half;
  let settle;
  if (Math.abs(diff) < 0.01) settle = 'الحساب متعادل بين الشريكين ✓';
  else { const from = diff > 0 ? 'u1' : 'u2'; settle = `على <b>${esc(uname(from))}</b> أن يسلّم <b>${esc(uname(from === 'u1' ? 'u2' : 'u1'))}</b> مبلغ <b>${money(Math.abs(diff))}</b> ليتساوى نصيب كل منهما.` }
  sheet(`<div class="sh-h"><button class="ib2" onclick="openMenu()">${ic('back')}</button><h3>ملخص الشركاء</h3></div>
  ${['u1', 'u2'].map(u => `<div class="pcard" style="--c:${ucolor(u)}"><div class="row" style="margin-bottom:6px">${ubadge(u)}</div>
    <div class="ln"><span class="mu">الواصل له من العملاء</span><b class="g">${money(d[u].r)}</b></div>
    <div class="ln"><span class="mu">ما صرفه</span><b class="r">${money(d[u].s)}</b></div>
    <div class="ln tot"><span>الصافي الموجود معه</span><span>${money(d[u].n)}</span></div></div>`).join('')}
  <div class="stats" style="margin:4px 0 12px"><div class="stat"><span>إجمالي الواصل</span><b class="g">${money(totR)}</b></div><div class="stat"><span>إجمالي المصروف</span><b class="r">${money(totS)}</b></div><div class="stat"><span>صافي الربح</span><b>${money(profit)}</b></div></div>
  <div class="settle"><b>التسوية (بافتراض المناصفة)</b><br>نصيب كل شريك: <b>${money(half)}</b><br>${settle}</div>`);
}

  sheet(`<div class="sh-h"><button class="ib2" onclick="openMenu()">${ic('back')}</button><h3>الإعدادات</h3></div>
  <div class="two"><div class="fld"><label>اسم ${esc(uname('u1'))}</label><input id="st_n1" value="${esc(s.users.u1.name)}"></div>

  <div class="fld"><label>رمز دخول جديد لك (${esc(uname(me))})</label><input id="st_pin" class="pin" type="password" inputmode="numeric" maxlength="4" placeholder="••••"><div class="hint">اتركه فارغاً لإبقاء الرمز الحالي. لا يمكنك تغيير رمز شريكك.</div></div>
  <div class="two"><div class="fld"><label>العملة</label><input id="st_cur" value="${esc(s.currency)}" maxlength="8"></div>

function saveSettings() {
  const s = JSON.parse(JSON.stringify(S.settings));
  const n1 = $('#st_n1').value.trim(), n2 = $('#st_n2').value.trim(), pin = toEn($('#st_pin').value);
  if (!n1 || !n2) return toast('الأسماء مطلوبة');
  if (pin && !/^\d{4}$/.test(pin)) return toast('الرمز يجب أن يكون 4 أرقام');
  s.users.u1.name = n1; s.users.u2.name = n2; if (pin) s.users[me].pin = pin;
  s.currency = $('#st_cur').value.trim() || 'ج.م'; s.cc = toEn($('#st_cc').value) || '20'; s.updatedAt = nowISO(); s.updatedBy = me;
  DB.setSettings(s); toast('تم حفظ الإعدادات'); showApp(); openMenu();
}
function openTrash() {
  const items = [
    ...S.customers.filter(x => x.deleted).map(x => ({ c: 'customers', o: x, t: 'عميل: ' + x.name, a: '' })),
    ...S.payments.filter(x => x.deleted).map(x => ({ c: 'payments', o: x, t: 'دفعة من ' + ((custById(x.customerId) || {}).name || 'عميل'), a: money(x.amount) })),
    ...S.expenses.filter(x => x.deleted).map(x => ({ c: 'expenses', o: x, t: 'مصروف: ' + x.title, a: money(x.amount) }))
  ].sort((a, b) => String(b.o.deletedAt).localeCompare(String(a.o.deletedAt)));
  const refresh = () => openTrash(); refresh._same = true;
  sheet(`<div class="sh-h"><button class="ib2" onclick="openMenu()">${ic('back')}</button><h3>المحذوفات</h3></div>
  ${items.length ? items.map(i => `<div class="mini"><div class="tx-ic ${i.c === 'expenses' ? 'ri' : 'gi'}">${ic(i.c === 'customers' ? 'users' : i.c === 'payments' ? 'in' : 'out')}</div>
    <div class="grow"><div style="font-weight:700" class="ell">${esc(i.t)} ${i.a ? '— ' + i.a : ''}</div><div class="mu">حذفه ${esc(uname(i.o.deletedBy))} • ${dt(i.o.deletedAt)}</div></div>
    <button class="badge bv" style="padding:7px 12px" onclick="restoreItem('${i.c}','${i.o.id}')">استرجاع</button></div>`).join('') : emptyBox('restore', 'لا توجد محذوفات', 'أي عنصر يُحذف يظهر هنا ويمكن استرجاعه')}`, refresh);
}
function restoreItem(c, id) {
  const o = S[c].find(x => x.id === id); if (!o) return;
  const n = { ...o, deleted: false, restoredAt: nowISO(), restoredBy: me }; delete n.deletedAt; delete n.deletedBy;
  save(c, n); toast('تم الاسترجاع ✓');
}

/* ---------- تصدير واستيراد ---------- */
function download(name, data, type) {
  const b = new Blob([data], { type }), a = document.createElement('a');
  a.href = URL.createObjectURL(b); a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove() }, 500);
}
function exportJSON() {
  const d = { app: 'partners-ledger', ver: APP_VER, exportedAt: nowISO(), exportedBy: uname(me), settings: { ...S.settings, users: { u1: { name: uname('u1') }, u2: { name: uname('u2') } } }, customers: S.customers, payments: S.payments, expenses: S.expenses };
  download(`نسخة-دفتر-الشراكة-${nowLocal().slice(0, 10)}.json`, JSON.stringify(d, null, 1), 'application/json'); toast('تم تنزيل النسخة الاحتياطية');
}
function exportCSV() {
  const q = v => '"' + String(v ?? '').replace(/"/g, '""') + '"';
  const rows = [['النوع', 'التاريخ', 'الوقت', 'العميل', 'البيان', 'المبلغ', 'الشريك', 'ملاحظات']];
  pays().forEach(p => rows.push(['وارد', dayKey(p.date), String(p.date).slice(11, 16), (custById(p.customerId) || {}).name, 'دفعة واصلة', p.amount, uname(p.user), p.note]));
  exps().forEach(e => rows.push(['مصروف', dayKey(e.date), String(e.date).slice(11, 16), e.customerId ? (custById(e.customerId) || {}).name : '', e.title, e.amount, uname(e.user), e.note]));
  const head = rows.shift(); rows.sort((a, b) => String(b[1] + b[2]).localeCompare(String(a[1] + a[2])));
  const cr = [[], ['العملاء'], ['الاسم', 'الجوال', 'العنوان', 'إجمالي الحساب', 'الواصل', 'المتبقي', 'ملاحظات']];
  custs().forEach(c => { const pd = paidOf(c.id); cr.push([c.name, c.phone, c.address, c.total || '', pd, c.total ? c.total - pd : '', c.notes]) });
  const csv = '﻿' + [head, ...rows, ...cr].map(r => r.map(q).join(',')).join('\r\n');
  download(`دفتر-الشراكة-${nowLocal().slice(0, 10)}.csv`, csv, 'text/csv;charset=utf-8'); toast('تم تصدير ملف Excel');
}
$('#impfile').addEventListener('change', e => {
  const f = e.target.files[0]; if (!f) return; const r = new FileReader();
  r.onload = () => {
    try {
      const d = JSON.parse(r.result); if (d.app !== 'partners-ledger') throw 0;
      let n = 0;
      COLS.forEach(c => (d[c] || []).forEach(o => { const ex = S[c].find(x => x.id === o.id); if (!ex || String(o.updatedAt || '') > String(ex.updatedAt || '')) { DB.put(c, o); n++ } }));
      toast(`تمت الاستعادة: ${n} عنصر`);
    } catch (err) { toast('الملف غير صالح') }
    e.target.value = '';
  };
  r.readAsText(f);
});

/* ---------- PWA ---------- */
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredInstall = e });
function doInstall() { if (!deferredInstall) return; deferredInstall.prompt(); deferredInstall.userChoice.finally(() => { deferredInstall = null; closeSheet() }) }
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => { });
window.addEventListener('online', render); window.addEventListener('offline', render);

/* ---------- التشغيل ---------- */
function start() {
  me = ls.get('me', null);
  if (!S.settings || !S.settings.users) return showSetup();
  if (!me || !S.settings.users[me]) return showLogin();
  showApp();
}
function boot() {
  if (FIREBASE_CONFIG) {
    const v = '10.12.2';
    loadScript(`https://www.gstatic.com/firebasejs/${v}/firebase-app-compat.js`)
      .then(() => loadScript(`https://www.gstatic.com/firebasejs/${v}/firebase-firestore-compat.js`))
      .then(() => { DB = Cloud; Cloud.init(start) })
      .catch(() => {
        $('#root').innerHTML = `<div class="auth">${LOGO}<h1>تعذّر الاتصال</h1><p class="tag">تأكد من اتصال الإنترنت ثم أعد المحاولة</p><button class="btn" style="max-width:260px" onclick="location.reload()">إعادة المحاولة</button></div>`;
      });
  } else { DB = Local; Local.init(start) }
}
boot();
</script>
